<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas Smoke Test</title>
<style>
  body{margin:0;background:#07111f;color:#f4f8ff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;padding:18px}
  h1{font-size:16px}
  .pass{color:#40e68b}.fail{color:#ff5d73}.info{color:#9bb0c8}
  li{margin:4px 0}
  #summary{font-size:15px;font-weight:bold;margin:12px 0;padding:10px;border-radius:8px;border:1px solid #29405a}
  iframe{width:1280px;height:800px;border:1px solid #29405a;border-radius:8px;opacity:.4}
</style>
</head>
<body>
<h1>AI Arsenal Atlas — smoke test</h1>
<p class="info">Zero-dependency harness. Serve the repo (<code>python3 -m http.server</code>) and open <code>/smoke.html</code>. The app loads in the iframe below and core flows are driven automatically.</p>
<div id="summary">Running…</div>
<ul id="results"></ul>
<iframe id="app" src="./index.html"></iframe>
<script>
localStorage.removeItem('atlasUser'); // same-origin as the app iframe — start each run with a clean personal layer
const results = [];
const errors = [];
const ul = document.getElementById('results');
function report(name, ok, detail){
  results.push(ok);
  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.textContent = `${ok ? 'PASS' : 'FAIL'} · ${name}${detail ? ' — ' + detail : ''}`;
  ul.appendChild(li);
}
function done(){
  const fails = results.filter(r => !r).length;
  const s = document.getElementById('summary');
  s.textContent = fails === 0 ? `✅ ALL ${results.length} CHECKS PASSED` : `❌ ${fails} / ${results.length} CHECKS FAILED`;
  s.style.borderColor = fails === 0 ? '#40e68b' : '#ff5d73';
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

const frame = document.getElementById('app');
frame.addEventListener('load', async () => {
  const w = frame.contentWindow, d = frame.contentDocument;
  w.addEventListener('error', e => errors.push(e.message));
  const click = el => el?.dispatchEvent(new w.MouseEvent('click', {bubbles: true}));
  try {
    await sleep(400);

    report('Tutorial does not auto-show on load', !!d.querySelector('.tutorial.hidden'));
    report('Welcome screen is the immediate landing view', d.getElementById('insTitle')?.textContent === 'The Whole Lab');
    d.getElementById('helpBtn')?.click();
    await sleep(150);
    report('Help button opens the tutorial on demand', !!d.querySelector('.tutorial:not(.hidden)'));
    d.getElementById('tSkip')?.click();
    await sleep(150);
    report('Tutorial skippable', !!d.querySelector('.tutorial.hidden'));

    report('9 districts render', d.querySelectorAll('.district').length === 9, `got ${d.querySelectorAll('.district').length}`);
    report('7 texture patterns defined', d.querySelectorAll('defs pattern').length === 7);
    report('World-switch fully removed', !d.querySelector('.world-switch'));
    report('ALL lens injected by view-defaults', !!d.getElementById('allLens'));

    // Enterable districts: click at Z1 → auto-zoom to Z2 + camera centers
    report('Starts at Z1', d.getElementById('zoomLabel').textContent === 'Z1 DISTRICT');
    click(d.querySelector('.district-forge'));
    await sleep(150);
    report('District click updates inspector', d.getElementById('insTitle')?.textContent === 'Model Forge');
    report('District click enters Z2', d.getElementById('zoomLabel').textContent === 'Z2 CONCEPT');
    report('District click centers camera', (d.getElementById('viewport').getAttribute('transform') || '').includes('translate') && !(d.getElementById('viewport').getAttribute('transform') || '').startsWith('translate(0 0)'));

    // Zoom-deeper chip is a real control
    const zchip = [...d.querySelectorAll('#insBody button[data-go-depth]')].find(b => b.dataset.goDepth === '3');
    report('Zoom-deeper chips are buttons', !!zchip);
    click(zchip);
    await sleep(150);
    report('Zoom-deeper chip zooms to Z3', d.getElementById('zoomLabel').textContent === 'Z3 IMPLEMENTATION');
    report('Z3 renders nodes', d.querySelectorAll('.node').length > 30, `got ${d.querySelectorAll('.node').length}`);
    report('Z3 renders implementation chips', d.querySelectorAll('.impl').length > 10, `got ${d.querySelectorAll('.impl').length}`);
    report('Nodes carry district tint hook', !!d.querySelector('.node[data-district]'));
    report('Crossing edges detected', d.querySelectorAll('.edge.crossing').length > 5);
    report('AI training territory present', !!d.querySelector('.node[data-id="finetune"]') && !!d.querySelector('.node[data-id="quant"]') && !!d.querySelector('.node[data-id="evals"]'));
    report('Edge density ≥ 45', d.querySelectorAll('.edge').length >= 45, `got ${d.querySelectorAll('.edge').length}`);

    click(d.querySelector('.impl'));
    await sleep(150);
    report('Implementation chip opens Compare', d.getElementById('overlay')?.classList.contains('open'));
    report('Compare cards carry district accent', !!d.querySelector('.compare-grid')?.style.getPropertyValue('--accent'));
    d.getElementById('modalClose')?.click();

    // Search + clickable breadcrumb back up to the district
    const input = d.getElementById('searchInput');
    input.value = 'run llm locally';
    d.getElementById('searchBtn').click();
    await sleep(200);
    report('Search resolves to concept', d.getElementById('insTitle')?.textContent === 'Model Server / API', `got "${d.getElementById('insTitle')?.textContent}"`);
    const crumbDistrict = d.querySelector('#crumbs button[data-crumb-district]');
    report('Breadcrumb district is clickable', !!crumbDistrict);
    click(crumbDistrict);
    await sleep(150);
    report('Breadcrumb navigates to district', d.getElementById('insTitle')?.textContent === 'Inference Works');
    click(d.querySelector('#crumbs button[data-crumb-home]'));
    await sleep(150);
    report('Breadcrumb home returns to welcome', d.getElementById('insTitle')?.textContent === 'The Whole Lab');

    // Learning Path steps travel
    input.value = 'run llm locally';
    d.getElementById('searchBtn').click();
    await sleep(200);
    click(d.querySelector('[data-action="learn"]'));
    await sleep(150);
    const learnStep = d.querySelector('#modalBody button[data-go-node]');
    report('Learning Path steps are buttons', !!learnStep);
    const stepName = learnStep?.textContent;
    click(learnStep);
    await sleep(150);
    report('Learning Path step navigates', d.getElementById('insTitle')?.textContent === stepName, `got "${d.getElementById('insTitle')?.textContent}"`);

    // Welcome panel: mission on-ramp + actionable chips
    d.getElementById('homeBtn').click();
    await sleep(150);
    report('Welcome offers 3 guided missions', d.querySelectorAll('#insBody button[data-go-mission]').length === 3);
    const searchChip = d.querySelector('#insBody button[data-go-search]');
    report('Try-this chips are buttons', !!searchChip && !!d.querySelector('#insBody button[data-go-builder]'));
    click(searchChip);
    await sleep(200);
    report('Try-this search chip navigates', (d.getElementById('insTitle')?.textContent || '').includes('MCP'), `got "${d.getElementById('insTitle')?.textContent}"`);

    // Mission playback from the welcome on-ramp, through to the completion summary
    d.getElementById('homeBtn').click();
    await sleep(150);
    report('10 missions available', d.getElementById('missionSelect')?.options.length === 10, `got ${d.getElementById('missionSelect')?.options.length}`);
    click(d.querySelector('#insBody button[data-go-mission="rag"]'));
    await sleep(2600);
    report('Mission chip starts playback', d.querySelectorAll('.packet').length > 0);
    const dataDistrict = d.querySelector('.district-knowledge');
    report('Mission keeps path districts visible (dim-fix)', dataDistrict && !dataDistrict.classList.contains('dim'));
    await sleep(6200); // rag mission completes at ~7.7s total
    report('Mission completion opens shopping list', d.getElementById('overlay')?.classList.contains('open') && (d.getElementById('modalTitle')?.textContent || '').startsWith('🏁'), `title "${d.getElementById('modalTitle')?.textContent}"`);
    report('Shopping list links official sources', d.querySelectorAll('#modalBody a.chip[href^="https"]').length >= 5, `got ${d.querySelectorAll('#modalBody a.chip[href^="https"]').length}`);
    d.getElementById('modalClose')?.click();
    d.getElementById('homeBtn').click();

    // Deep links: hash write, hash apply, browser back
    d.getElementById('homeBtn').click();
    await sleep(200);
    click(d.querySelector('.district-forge'));
    await sleep(250);
    report('Selecting a district writes the URL hash', w.location.hash === '#d/forge', `got "${w.location.hash}"`);
    w.location.hash = '#c/mcp';
    await sleep(300);
    report('Deep link navigates to concept', d.getElementById('insTitle')?.textContent === 'MCP Interface', `got "${d.getElementById('insTitle')?.textContent}"`);
    w.history.back();
    await sleep(400);
    report('Browser back restores prior state', d.getElementById('insTitle')?.textContent === 'Model Forge', `got "${d.getElementById('insTitle')?.textContent}"`);

    // Search autocomplete
    d.getElementById('homeBtn').click();
    await sleep(200);
    const si = d.getElementById('searchInput');
    si.value = 'vec';
    si.dispatchEvent(new w.Event('input', {bubbles: true}));
    await sleep(200);
    const menuOpts = d.querySelectorAll('#searchMenu button');
    report('Autocomplete menu lists matches', menuOpts.length >= 2, `got ${menuOpts.length}`);
    click(menuOpts[0]);
    await sleep(300);
    report('Autocomplete option navigates', (d.getElementById('insTitle')?.textContent || '').length > 0 && d.getElementById('insTitle')?.textContent !== 'The Whole Lab', `got "${d.getElementById('insTitle')?.textContent}"`);
    report('Autocomplete menu closed after pick', d.getElementById('searchMenu').hidden === true);

    // Pinch zoom (two synthetic pointers)
    d.getElementById('homeBtn').click();
    await sleep(200);
    const svgTarget = d.getElementById('worldSvg');
    const pev = (type, id, x, y) => svgTarget.dispatchEvent(new w.PointerEvent(type, {pointerId: id, clientX: x, clientY: y, bubbles: true}));
    pev('pointerdown', 1, 500, 400); pev('pointerdown', 2, 700, 400);
    pev('pointermove', 2, 800, 400); pev('pointermove', 2, 900, 400);
    pev('pointerup', 1, 500, 400); pev('pointerup', 2, 900, 400);
    await sleep(250);
    const tf = d.getElementById('viewport').getAttribute('transform') || '';
    const sc = parseFloat((tf.match(/scale\(([\d.]+)\)/) || [])[1] || '0');
    report('Pinch gesture zooms the map', sc > 1.5, `scale ${sc}`);
    report('Pinch end snaps semantic depth', d.getElementById('zoomLabel').textContent === 'Z5 ENGINEERING', `got "${d.getElementById('zoomLabel').textContent}"`);
    d.getElementById('homeBtn').click();
    await sleep(150);

    // Personal layer: pin, note, my-link lifecycle
    w.location.hash = '#c/vector';
    await sleep(300);
    const pinBtn = d.querySelector('#insBody button[data-pin]');
    report('Inspector offers My layer controls', !!pinBtn && !!d.querySelector('#insBody button[data-link-start]') && !!d.querySelector('#insBody textarea[data-note]'));
    click(pinBtn);
    await sleep(200);
    report('Pin persists to localStorage', (JSON.parse(w.localStorage.getItem('atlasUser') || '{}').pins || []).includes('vector'));
    report('Pin marker renders on node', !!d.querySelector('.node[data-id="vector"] .pinmark'));
    const noteEl = d.querySelector('#insBody textarea[data-note]');
    noteEl.value = 'my smoke-test note';
    noteEl.dispatchEvent(new w.Event('input', {bubbles: true}));
    await sleep(150);
    report('Note persists to localStorage', (JSON.parse(w.localStorage.getItem('atlasUser') || '{}').notes || {}).vector === 'my smoke-test note');
    click(d.querySelector('#insBody button[data-link-start]'));
    await sleep(150);
    click(d.querySelector('.node[data-id="retriever"]'));
    await sleep(250);
    report('Two-click link draws a my-link edge', d.querySelectorAll('.edge.mylink').length === 1, `got ${d.querySelectorAll('.edge.mylink').length}`);
    report('Link persists to localStorage', (JSON.parse(w.localStorage.getItem('atlasUser') || '{}').links || []).length === 1);
    const linkHit = [...d.querySelectorAll('.edge-hit')].find(h => (h.getAttribute('aria-label') || '').startsWith('your link'));
    click(linkHit);
    await sleep(200);
    report('My-link edge opens its inspector', d.getElementById('insEyebrow')?.textContent === 'MY LINK');
    click(d.querySelector('#insBody button[data-remove-link]'));
    await sleep(200);
    report('Remove link deletes edge and storage', d.querySelectorAll('.edge.mylink').length === 0 && (JSON.parse(w.localStorage.getItem('atlasUser') || '{}').links || []).length === 0);
    d.getElementById('homeBtn').click();
    await sleep(200);
    report('Welcome shows pinned collection', [...d.querySelectorAll('#insBody h3')].some(h => h.textContent.includes('Pinned')) && !!d.querySelector('#insBody button[data-go-node="vector"]'));
    w.localStorage.removeItem('atlasUser');

    // Steppable mechanisms: Z4 click-through stages
    w.location.hash = '#c/mcp';
    await sleep(300);
    click(d.querySelector('[data-action="xray"]'));
    await sleep(200);
    let nextBtn = d.querySelector('#insBody button[data-mech-next]');
    report('Mechanism stepper renders at Z4', !!nextBtn, `zoom "${d.getElementById('zoomLabel')?.textContent}"`);
    report('Prev disabled at step 1', d.querySelector('#insBody button[data-mech-prev]')?.disabled === true);
    click(nextBtn);
    await sleep(200);
    report('Next advances the step and grows the highlight path', d.getElementById('insTitle') && (d.querySelectorAll('#insBody .mechdot.on').length === 2) && (d.querySelectorAll('.packet').length > 0 || w.location.hash), `dots ${d.querySelectorAll('#insBody .mechdot.on').length}`);
    click(d.querySelector('#insBody button[data-mech-prev]'));
    await sleep(200);
    report('Prev retreats the step', d.querySelectorAll('#insBody .mechdot.on').length === 1, `dots ${d.querySelectorAll('#insBody .mechdot.on').length}`);

    // Builder → map wiring
    d.getElementById('homeBtn').click();
    await sleep(150);
    click(d.querySelector('#insBody button[data-go-builder]'));
    await sleep(200);
    click(d.querySelector('.partbtn[data-part="tool"]'));
    click(d.querySelector('.partbtn[data-part="loop"]'));
    await sleep(150);
    const showMapBtn = d.getElementById('builderShowMap');
    report('Builder offers Show on map once composed', !!showMapBtn && showMapBtn.disabled === false);
    click(showMapBtn);
    await sleep(250);
    report('Show on map closes the modal', !d.getElementById('overlay')?.classList.contains('open'));
    report('Show on map highlights the composed path', d.querySelectorAll('.edge.active').length > 0 || d.querySelectorAll('.packet').length > 0);
    d.getElementById('homeBtn').click();
    await sleep(150);

    // Provenance: stability tags + verified dates
    w.location.hash = '#c/modelServer';
    await sleep(300);
    click(d.querySelector('[data-action="compare"]'));
    await sleep(200);
    const stabSpans = [...d.querySelectorAll('.compare-card .kv span')].filter(s => /STABLE|EVOLVING|VOLATILE|UNRATED/.test(s.textContent));
    report('Compare cards show a stability rating', stabSpans.length > 0, `got ${stabSpans.length}`);
    report('No implementation is unrated', ![...d.querySelectorAll('.compare-card')].some(c => c.textContent.includes('UNRATED')));
    report('Compare cards show a verified date', [...d.querySelectorAll('.compare-card')].every(c => c.textContent.includes('2026-08-09')));
    report('Compare legend explains the stability colors', !!d.querySelector('.stab-legend'));
    d.getElementById('modalClose')?.click();
    d.getElementById('zoomIn').click();
    await sleep(150);
    report('Z3 impl chips render a stability dot', !!d.querySelector('.impl .implstab'));
    d.getElementById('homeBtn').click();
    await sleep(150);

    // Ontological rigor: every node has a real (non-generic) six-fact entry
    d.getElementById('homeBtn').click();
    await sleep(150);
    w.location.hash = '#c/ide';
    await sleep(250);
    report('Previously-generic node has real ELI5', (d.getElementById('insBody')?.textContent || '').includes('pair-write'));
    w.location.hash = '#c/git';
    await sleep(250);
    report('Every previously-generic node is hand-authored', !(d.getElementById('insBody')?.textContent || '').includes('is the') , `got "${(d.getElementById('insBody')?.textContent||'').slice(0,80)}"`);
    d.getElementById('homeBtn').click();
    await sleep(150);

    // Adaptive complexity: edge bundling at Z0/Z1, full detail at Z2+
    report('Z1 shows bundled edges, not individual ones', d.querySelectorAll('.edge-bundle').length > 5 && d.querySelectorAll('.edge:not(.edge-bundle):not(.edge-hit)').length === 0, `bundles ${d.querySelectorAll('.edge-bundle').length}`);
    const bundleHit = d.querySelector('.edge-hit[aria-label*="connection"]');
    click(bundleHit);
    await sleep(150);
    report('Clicking a bundle summarizes its connections', (d.getElementById('toast')?.textContent || '').includes('connection'), `got "${d.getElementById('toast')?.textContent}"`);
    d.getElementById('zoomIn').click();
    await sleep(150);
    report('Z2+ restores full per-edge detail', d.querySelectorAll('.edge-bundle').length === 0 && d.querySelectorAll('.edge:not(.edge-bundle):not(.edge-hit)').length > 40, `edges ${d.querySelectorAll('.edge:not(.edge-bundle):not(.edge-hit)').length}`);
    d.getElementById('zoomOut').click();
    await sleep(150);
    d.getElementById('missionSelect').value = 'chatbot'; // its 2nd edge (chat→modelServer) crosses districts early, unlike rag's late-only crossing
    d.getElementById('missionPlay').click();
    await sleep(2800);
    report('Mission playback highlights bundles while zoomed out', d.querySelectorAll('.edge-bundle.active').length > 0);
    d.getElementById('missionPlay').click();
    d.getElementById('homeBtn').click();
    await sleep(150);

    // Latent bug fix: Home closes any open modal instead of leaving it stranded
    click(d.querySelector('#insBody button[data-go-mission="chatbot"]'));
    await sleep(7200); // 6-step chatbot mission completes (6 × 1100ms) and opens its summary modal
    report('Mission completion left the summary modal open (setup)', d.getElementById('overlay')?.classList.contains('open'));
    d.getElementById('homeBtn').click();
    await sleep(150);
    report('Home closes a stranded modal', !d.getElementById('overlay')?.classList.contains('open'));

    // Frontend QA sweep: fitText overflow guard, breadcrumb/statuskey spacing, minimap bounds, tablet footer overflow
    d.getElementById('homeBtn').click();
    await sleep(150);
    for (let i = 0; i < 4; i++) d.getElementById('zoomIn').click(); // Z1 -> Z5
    await sleep(150);
    const textOverflows = [];
    d.querySelectorAll('#nodesLayer text, #districtLayer text').forEach(t => {
      try {
        const len = t.getComputedTextLength();
        const g = t.closest('g'); if (!g) return;
        const rectEl = g.querySelector('rect'); if (!rectEl) return;
        const rw = parseFloat(rectEl.getAttribute('width')) || 0, rx = parseFloat(rectEl.getAttribute('x')) || 0, tx = parseFloat(t.getAttribute('x')) || 0;
        if (len > (rx + rw - tx) + 2) textOverflows.push(t.textContent);
      } catch (e) {}
    });
    report('fitText: no label overflows its container at Z5', textOverflows.length === 0, `overflowing: ${textOverflows.join(', ')}`);
    d.getElementById('homeBtn').click();
    await sleep(150);

    // Breadcrumb vs status badge: realistic deep path must not overlap
    w.location.hash = '#c/cloudAi';
    await sleep(300);
    const crumbsR = d.getElementById('crumbs').getBoundingClientRect();
    const statusR = d.getElementById('statusKey').getBoundingClientRect();
    report('Breadcrumb does not overlap status badge', crumbsR.right <= statusR.left, `crumbs right ${Math.round(crumbsR.right)}, status left ${Math.round(statusR.left)}`);
    d.getElementById('homeBtn').click();
    await sleep(150);

    // Minimap viewport indicator stays within its own border across every zoom depth
    let mmOverflow = false;
    for (let i = 0; i < 6; i++) {
      const v = d.getElementById('miniViewport');
      const x = parseFloat(v.getAttribute('x')), y = parseFloat(v.getAttribute('y')), vw = parseFloat(v.getAttribute('width')), vh = parseFloat(v.getAttribute('height'));
      if (x < 7.99 || y < 7.99 || x + vw > 1592.01 || y + vh > 892.01) mmOverflow = true;
      d.getElementById('zoomIn').click();
    }
    report('Minimap viewport indicator stays within its border at every zoom depth', !mmOverflow);
    d.getElementById('homeBtn').click();
    await sleep(150);

    // Tablet-width footer: lens row + mission controls must not overflow horizontally
    frame.style.width = '768px';
    await sleep(200);
    const bottomEl = d.querySelector('.bottom');
    report('Tablet-width footer has no horizontal overflow', bottomEl.scrollWidth <= bottomEl.clientWidth + 1, `scrollW ${bottomEl.scrollWidth}, clientW ${bottomEl.clientWidth}`);
    frame.style.width = '1280px';
    await sleep(200);

    // Mobile dead-space fix: map switches to a full-bleed slice only where letterboxing would be severe
    report('Desktop width keeps the letterboxed fit (no crop)', d.getElementById('worldSvg').getAttribute('preserveAspectRatio') === 'xMidYMid meet');
    frame.style.width = '375px';
    w.dispatchEvent(new w.Event('resize')); // frame.style.width alone doesn't reliably forward a resize event into the iframe
    await sleep(300);
    report('Portrait width switches to full-bleed slice', d.getElementById('worldSvg').getAttribute('preserveAspectRatio') === 'xMidYMid slice');
    // Note: the minimap-vs-inspector-peek clearance itself (bottom:86px in the ≤900px tier) is verified
    // by direct real-browser measurement, not here — this iframe's simulated resize doesn't recompute
    // the inspector's CSS transform the way a genuine viewport resize does, so that pixel geometry isn't
    // faithfully testable through this harness.
    report('Minimap re-appears at phone width', getComputedStyle(d.querySelector('.minimap')).display !== 'none');
    frame.style.width = '1280px';
    await sleep(300);

    report('No JS errors during run', errors.length === 0, errors.join('; '));
  } catch (e) {
    report('Harness completed without exception', false, e.message);
  }
  done();
});
</script>
</body>
</html>
